<!doctype html>
<html lang="fa" dir="rtl" class="dark" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="صفحه بازیابی رمز عبور وب\u200cریک — نسخه دو مرحله\u200cای با کد تأیید">
  <title>وب\u200cریک | بازیابی رمز عبور</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/icons.js"></script>
  <script src="js/auth-theme.js"></script>
</head>
<body>
  <div class="wr-page">
    <!-- Aurora animated background -->
    <div class="wr-aurora" aria-hidden="true"><span></span></div>

    <!-- Theme toggle (top-left fixed) -->
    <div class="wr-theme">
      <button type="button" data-theme-toggle aria-label="تغییر حالت نمایش" class="wr-theme-btn">
        <span data-icon="sun" aria-hidden="true"></span>
        <span class="wr-theme-text">حالت روشن</span>
      </button>
    </div>

    <main class="wr-card" aria-label="فرم بازیابی رمز عبور">
      <header class="wr-head">
        <div class="wr-brand" data-brand>وب\u200cریک</div>
        <h1 class="wr-title" id="resetTitle">بازیابی رمز عبور</h1>
        <p class="wr-subtitle" id="resetSubtitle">برای بازیابی رمز، ایمیل یا شماره موبایل خود را وارد کنید.</p>
      </header>

      <!-- Step indicator -->
      <div class="wr-steps" role="progressbar" aria-label="مراحل بازیابی" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
        <div class="wr-step active" data-step="1">
          <span class="wr-step-dot">۱</span>
        </div>
        <span class="wr-step-line" data-line="1"></span>
        <div class="wr-step" data-step="2">
          <span class="wr-step-dot">۲</span>
        </div>
        <span class="wr-step-line" data-line="2"></span>
        <div class="wr-step" data-step="3">
          <span class="wr-step-dot">۳</span>
        </div>
      </div>

      <form id="resetForm" novalidate>
        <!-- Step 1: Identity -->
        <div class="wr-form-step active" data-step="1">
          <div class="wr-field">
            <label class="wr-label" for="resetIdentity">
              <span>ایمیل یا شماره موبایل</span>
              <span class="wr-req" aria-hidden="true">*</span>
            </label>
            <div class="wr-input-wrap">
              <span class="wr-input-icon" data-icon="user" aria-hidden="true"></span>
              <input class="wr-input wr-ltr" id="resetIdentity" name="identity" type="text"
                     autocomplete="email" inputmode="text"
                     placeholder="name@example.com یا 0912..." required
                     aria-describedby="resetIdentityHint">
            </div>
            <div id="resetIdentityHint" class="wr-subtitle" style="margin-top:8px;font-size:12.5px;text-align:right;width:100%">
              ما لینک یا کد بازیابی را برای شما ارسال می\u200cکنیم.
            </div>
          </div>

          <button class="wr-submit" type="button" data-action="send-code">
            <span class="wr-btn-text">ارسال کد بازیابی</span>
          </button>

          <div style="display:flex;justify-content:center;margin-top:16px">
            <a class="wr-back" href="login.html">
              <span data-icon="arrowLeft" aria-hidden="true"></span>
              بازگشت به ورود
            </a>
          </div>
        </div>

        <!-- Step 2: OTP code -->
        <div class="wr-form-step" data-step="2" hidden>
          <div class="wr-field" style="text-align:center">
            <label class="wr-label" style="justify-content:center">
              <span>کد ۶ رقمی ارسال\u200cشده را وارد کنید</span>
            </label>
            <div class="wr-otp" id="otpContainer" role="group" aria-label="کد تأیید ۶ رقمی">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۱" autocomplete="off">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۲" autocomplete="off">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۳" autocomplete="off">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۴" autocomplete="off">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۵" autocomplete="off">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="رقم ۶" autocomplete="off">
            </div>
            <div class="wr-error-msg" id="otpError" role="alert" style="justify-content:center"></div>
          </div>

          <div class="wr-timer" id="timerWrap">
            <span id="timerText">ارسال مجدد در <strong id="timerCount">۶۰</strong> ثانیه</span>
            <button type="button" class="wr-timer-btn" id="resendBtn" disabled>ارسال مجدد کد</button>
          </div>

          <button class="wr-submit" type="button" data-action="verify-code">
            <span class="wr-btn-text">تأیید کد و ادامه</span>
          </button>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap">
            <button type="button" class="wr-back" data-action="back" data-to="1">
              <span data-icon="arrowLeft" aria-hidden="true"></span>
              مرحله قبل
            </button>
            <button type="button" class="wr-link" data-action="back" data-to="1" style="background:none;border:0;padding:0;font:inherit">تغییر ایمیل/موبایل</button>
          </div>
        </div>

        <!-- Step 3: New password -->
        <div class="wr-form-step" data-step="3" hidden>
          <div class="wr-field wr-password">
            <label class="wr-label" for="newPassword">
              <span>رمز عبور جدید</span>
              <span class="wr-req" aria-hidden="true">*</span>
            </label>
            <div class="wr-input-wrap">
              <span class="wr-input-icon" data-icon="lock" aria-hidden="true"></span>
              <input class="wr-input" id="newPassword" name="new_password" type="password"
                     autocomplete="new-password" placeholder="حداقل ۸ نویسه" required>
              <button class="wr-eye" type="button" data-target="newPassword"
                      aria-label="نمایش رمز" data-icon="eye"></button>
            </div>
          </div>

          <div class="wr-field wr-password">
            <label class="wr-label" for="confirmNewPassword">
              <span>تکرار رمز عبور جدید</span>
              <span class="wr-req" aria-hidden="true">*</span>
            </label>
            <div class="wr-input-wrap">
              <span class="wr-input-icon" data-icon="lock" aria-hidden="true"></span>
              <input class="wr-input" id="confirmNewPassword" name="confirm_new_password" type="password"
                     autocomplete="new-password" placeholder="تکرار رمز عبور" required>
              <button class="wr-eye" type="button" data-target="confirmNewPassword"
                      aria-label="نمایش رمز" data-icon="eye"></button>
            </div>
          </div>

          <button class="wr-submit" type="button" data-action="set-password">
            <span class="wr-btn-text">تنظیم رمز جدید و ورود</span>
          </button>

          <div style="display:flex;justify-content:center;margin-top:16px">
            <button type="button" class="wr-back" data-action="back" data-to="2">
              <span data-icon="arrowLeft" aria-hidden="true"></span>
              مرحله قبل
            </button>
          </div>
        </div>
      </form>

      <footer class="wr-footer">© وب\u200cریک — قالب RTL حرفه\u200cای · <a href="index.html">همه تم\u200cها</a></footer>
    </main>

    <div class="wr-toast" aria-live="polite" role="status"></div>
  </div>

<script>
/* ============================================================
   WEBRIC Reset Password v3.0 — multi-step flow
   Step 1: Identity (email/phone)
   Step 2: 6-digit OTP with auto-advance + 60s resend timer
   Step 3: New password (with strength meter + confirm)
   ============================================================ */
(function(){
  'use strict';

  /* ---------- Helpers (reuse auth.js utilities if available) ---------- */
  function toast(msg, type){
    let t = document.querySelector('.wr-toast');
    if (!t){
      t = document.createElement('div');
      t.className = 'wr-toast';
      t.setAttribute('aria-live','polite');
      t.setAttribute('role','status');
      document.body.appendChild(t);
    }
    t.textContent = '';
    t.dataset.type = type || 'info';
    if (window.WebricIcons){
      const iconMap = { success:'checkCircle', error:'alertCircle', info:'info' };
      const span = document.createElement('span');
      span.innerHTML = window.WebricIcons.get(iconMap[type] || 'info');
      t.appendChild(span.firstChild);
    }
    t.appendChild(document.createTextNode(msg));
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ---------- State ---------- */
  let currentStep = 1;
  let timerInterval = null;
  let timerSeconds = 60;
  let generatedOtp = ''; /* demo only — replaced by server in production */

  /* ---------- Step navigation ---------- */
  function showStep(n){
    currentStep = n;
    document.querySelectorAll('.wr-form-step').forEach(s => {
      const active = Number(s.dataset.step) === n;
      s.classList.toggle('active', active);
      s.hidden = !active;
    });
    /* Update step indicator */
    document.querySelectorAll('.wr-step').forEach(s => {
      const sn = Number(s.dataset.step);
      s.classList.toggle('active', sn === n);
      s.classList.toggle('done', sn < n);
      if (sn < n){
        s.querySelector('.wr-step-dot').textContent = '✓';
      } else {
        s.querySelector('.wr-step-dot').textContent = ['','۱','۲','۳'][sn];
      }
    });
    document.querySelectorAll('.wr-step-line').forEach(l => {
      const ln = Number(l.dataset.line);
      l.classList.toggle('is-done', ln < n);
    });
    /* Update aria */
    document.querySelector('.wr-steps').setAttribute('aria-valuenow', String(n));
    /* Update title/subtitle */
    const title = document.getElementById('resetTitle');
    const subtitle = document.getElementById('resetSubtitle');
    if (n === 1){
      title.textContent = 'بازیابی رمز عبور';
      subtitle.textContent = 'برای بازیابی رمز، ایمیل یا شماره موبایل خود را وارد کنید.';
    } else if (n === 2){
      title.textContent = 'تأیید کد';
      subtitle.textContent = 'کد ۶ رقمی ارسال\u200cشده را وارد کنید.';
      /* Focus first OTP input */
      setTimeout(() => {
        const first = document.querySelector('.wr-otp input');
        if (first) first.focus();
      }, 200);
      startTimer();
    } else if (n === 3){
      title.textContent = 'رمز جدید';
      subtitle.textContent = 'رمز عبور جدید خود را وارد کنید.';
      setTimeout(() => {
        const el = document.getElementById('newPassword');
        if (el) el.focus();
      }, 200);
    }
  }

  /* ---------- Validation (reuse auth.js helpers if available) ---------- */
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const PHONE_RE = /^(\+98|0)?9[0-9]{9}$/;
  function validateIdentity(v){
    if (!v) return 'این فیلد الزامی است.';
    if (EMAIL_RE.test(v) || PHONE_RE.test(v.replace(/\s/g,''))) return null;
    return 'ایمیل یا شماره موبایل معتبر نیست.';
  }

  function showFieldError(input, msg){
    const field = input.closest('.wr-field');
    if (!field) return;
    field.classList.remove('is-valid');
    field.classList.add('is-error');
    let err = field.querySelector('.wr-error-msg');
    if (!err){
      err = document.createElement('div');
      err.className = 'wr-error-msg';
      err.setAttribute('role','alert');
      field.appendChild(err);
    }
    err.innerHTML = '';
    if (window.WebricIcons){
      const span = document.createElement('span');
      span.setAttribute('aria-hidden','true');
      span.innerHTML = window.WebricIcons.get('alertCircle');
      err.appendChild(span.firstChild);
    }
    err.appendChild(document.createTextNode(msg));
  }
  function clearFieldError(input){
    const field = input.closest('.wr-field');
    if (!field) return;
    field.classList.remove('is-error','is-valid');
    const err = field.querySelector('.wr-error-msg');
    if (err) err.remove();
  }

  /* ---------- Step 1: send code ---------- */
  function sendCode(){
    const input = document.getElementById('resetIdentity');
    const value = input.value.trim();
    const err = validateIdentity(value);
    if (err){
      showFieldError(input, err);
      input.focus();
      return;
    }
    /* Loading state */
    const btn = document.querySelector('[data-action="send-code"]');
    if (btn){ btn.classList.add('is-loading'); btn.disabled = true; }
    /* Generate demo OTP */
    generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
    setTimeout(() => {
      if (btn){ btn.classList.remove('is-loading'); btn.disabled = false; }
      showStep(2);
      /* Show demo OTP as a toast (in production, server sends via SMS/email) */
      toast('کد نمایشی ارسال شد: ' + generatedOtp, 'info');
    }, 800);
  }

  /* ---------- Step 2: timer ---------- */
  function startTimer(){
    timerSeconds = 60;
    if (timerInterval) clearInterval(timerInterval);
    updateTimerDisplay();
    const resendBtn = document.getElementById('resendBtn');
    if (resendBtn) resendBtn.disabled = true;
    timerInterval = setInterval(() => {
      timerSeconds--;
      if (timerSeconds <= 0){
        clearInterval(timerInterval);
        const txt = document.getElementById('timerText');
        if (txt) txt.textContent = 'اگر کد را دریافت نکردید:';
        if (resendBtn){ resendBtn.disabled = false; }
      } else {
        updateTimerDisplay();
      }
    }, 1000);
  }
  function updateTimerDisplay(){
    const el = document.getElementById('timerCount');
    if (el) el.textContent = String(timerSeconds);
  }

  function resendCode(){
    generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
    startTimer();
    toast('کد جدید ارسال شد: ' + generatedOtp, 'info');
  }

  /* ---------- Step 2: verify code ---------- */
  function getOtpValue(){
    return Array.from(document.querySelectorAll('.wr-otp input')).map(i => i.value).join('');
  }
  function verifyCode(){
    const code = getOtpValue();
    if (code.length !== 6 || !/^\d{6}$/.test(code)){
      const err = document.getElementById('otpError');
      if (err){
        err.innerHTML = '';
        if (window.WebricIcons){
          const span = document.createElement('span');
          span.setAttribute('aria-hidden','true');
          span.innerHTML = window.WebricIcons.get('alertCircle');
          err.appendChild(span.firstChild);
        }
        err.appendChild(document.createTextNode('کد ۶ رقمی را به\u200cطور کامل وارد کنید.'));
        err.style.opacity = '1';
        err.style.maxHeight = '40px';
      }
      const first = document.querySelector('.wr-otp input');
      if (first) first.focus();
      return;
    }
    /* In demo: accept any 6-digit code; in production verify with server */
    const btn = document.querySelector('[data-action="verify-code"]');
    if (btn){ btn.classList.add('is-loading'); btn.disabled = true; }
    setTimeout(() => {
      if (btn){ btn.classList.remove('is-loading'); btn.disabled = false; }
      /* Clear OTP for security */
      document.querySelectorAll('.wr-otp input').forEach(i => i.value = '');
      showStep(3);
    }, 700);
  }

  /* ---------- Step 3: set new password ---------- */
  function validatePassword(v){
    if (!v) return 'این فیلد الزامی است.';
    if (v.length < 8) return 'رمز عبور باید حداقل ۸ نویسه باشد.';
    return null;
  }
  function scorePassword(pw){
    if (!pw) return 0;
    let s = 0;
    if (pw.length >= 8) s++;
    if (pw.length >= 12) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    if (s <= 1) return 1;
    if (s === 2) return 2;
    if (s === 3) return 3;
    return 4;
  }
  function strengthText(l){ return ['','ضعیف','متوسط','قوی','خیلی قوی'][l] || ''; }

  function ensureStrengthMeter(field){
    let meter = field.querySelector('.wr-strength');
    if (!meter){
      meter = document.createElement('div');
      meter.className = 'wr-strength';
      meter.innerHTML = '<div class="wr-strength-bars"><span class="wr-strength-bar"></span><span class="wr-strength-bar"></span><span class="wr-strength-bar"></span><span class="wr-strength-bar"></span></div><span class="wr-strength-text"></span>';
      field.appendChild(meter);
    }
    return meter;
  }

  function setPassword(){
    const pw = document.getElementById('newPassword');
    const pw2 = document.getElementById('confirmNewPassword');
    const v1 = pw.value, v2 = pw2.value;
    let err = validatePassword(v1);
    if (err){
      showFieldError(pw, err);
      pw.focus();
      return;
    }
    if (!v2 || v2 !== v1){
      showFieldError(pw2, 'رمزهای عبور یکسان نیستند.');
      pw2.focus();
      return;
    }
    /* Loading */
    const btn = document.querySelector('[data-action="set-password"]');
    if (btn){ btn.classList.add('is-loading'); btn.disabled = true; }
    setTimeout(() => {
      toast('رمز عبور با موفقیت تغییر کرد.', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }, 700);
  }

  /* ---------- OTP input behavior: auto-advance + paste ---------- */
  function setupOtpInputs(){
    const inputs = Array.from(document.querySelectorAll('.wr-otp input'));
    inputs.forEach((input, idx) => {
      input.addEventListener('input', function(e){
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v;
        if (v){
          e.target.classList.add('is-filled');
          if (idx < inputs.length - 1) inputs[idx + 1].focus();
        } else {
          e.target.classList.remove('is-filled');
        }
      });
      input.addEventListener('keydown', function(e){
        if (e.key === 'Backspace' && !e.target.value && idx > 0){
          inputs[idx - 1].focus();
          inputs[idx - 1].value = '';
          inputs[idx - 1].classList.remove('is-filled');
        }
        if (e.key === 'ArrowLeft' && idx < inputs.length - 1) inputs[idx + 1].focus();
        if (e.key === 'ArrowRight' && idx > 0) inputs[idx - 1].focus();
      });
      input.addEventListener('paste', function(e){
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const digits = text.replace(/\D/g, '').slice(0, 6);
        if (!digits) return;
        inputs.forEach((inp, i) => {
          inp.value = digits[i] || '';
          if (digits[i]) inp.classList.add('is-filled');
        });
        const focusIdx = Math.min(digits.length, inputs.length - 1);
        inputs[focusIdx].focus();
      });
    });
  }

  /* ---------- Eye toggle (since auth.js not loaded here) ---------- */
  function setupEyes(){
    document.querySelectorAll('.wr-eye[data-target]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        if (window.WebricIcons){
          btn.innerHTML = window.WebricIcons.get(show ? 'eyeOff' : 'eye');
        }
        btn.setAttribute('aria-label', show ? 'پنهان کردن رمز' : 'نمایش رمز');
      });
    });
  }

  /* ---------- Strength meter ---------- */
  function setupStrength(){
    const pw = document.getElementById('newPassword');
    if (!pw) return;
    const field = pw.closest('.wr-field');
    if (!field) return;
    pw.addEventListener('input', function(){
      const v = pw.value;
      if (v){
        field.classList.add('has-input');
        const meter = ensureStrengthMeter(field);
        const level = scorePassword(v);
        meter.dataset.level = String(level);
        const txt = meter.querySelector('.wr-strength-text');
        if (txt) txt.textContent = strengthText(level);
      } else {
        field.classList.remove('has-input');
      }
      if (field.classList.contains('is-error') && v) clearFieldError(pw);
    });
    pw.addEventListener('blur', function(){
      if (!pw.value) return;
      const err = validatePassword(pw.value);
      if (err) showFieldError(pw, err);
      else { clearFieldError(pw); field.classList.add('is-valid'); }
    });
  }

  function setupConfirm(){
    const pw = document.getElementById('newPassword');
    const pw2 = document.getElementById('confirmNewPassword');
    if (!pw || !pw2) return;
    const field = pw2.closest('.wr-field');
    if (!field) return;
    pw2.addEventListener('blur', function(){
      if (!pw2.value) return;
      if (pw2.value !== pw.value){
        showFieldError(pw2, 'رمزهای عبور یکسان نیستند.');
      } else {
        clearFieldError(pw2);
        field.classList.add('is-valid');
      }
    });
    pw2.addEventListener('input', function(){
      if (field.classList.contains('is-error') && pw2.value) clearFieldError(pw2);
    });
  }

  /* ---------- Init ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    setupOtpInputs();
    setupEyes();
    setupStrength();
    setupConfirm();

    /* Step 1 button */
    const sendBtn = document.querySelector('[data-action="send-code"]');
    if (sendBtn) sendBtn.addEventListener('click', sendCode);

    /* Step 2 buttons */
    const verifyBtn = document.querySelector('[data-action="verify-code"]');
    if (verifyBtn) verifyBtn.addEventListener('click', verifyCode);
    const resendBtn = document.getElementById('resendBtn');
    if (resendBtn) resendBtn.addEventListener('click', resendCode);

    /* Step 3 button */
    const setBtn = document.querySelector('[data-action="set-password"]');
    if (setBtn) setBtn.addEventListener('click', setPassword);

    /* Back buttons */
    document.querySelectorAll('[data-action="back"]').forEach(btn => {
      btn.addEventListener('click', function(e){
        e.preventDefault();
        const to = Number(btn.dataset.to);
        if (to < currentStep) showStep(to);
      });
    });

    /* Enter key on identity field triggers send-code */
    const identity = document.getElementById('resetIdentity');
    if (identity){
      identity.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); sendCode(); }
      });
    }

    /* Enter key on OTP last input triggers verify */
    const lastOtp = document.querySelector('.wr-otp input:last-child');
    if (lastOtp){
      lastOtp.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && getOtpValue().length === 6){ e.preventDefault(); verifyCode(); }
      });
    }

    /* Enter on confirm password triggers set-password */
    const confirm = document.getElementById('confirmNewPassword');
    if (confirm){
      confirm.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); setPassword(); }
      });
    }
  });
})();

  /* Mobile touch fallback for reset-page action buttons. */
  (function(){
    const recent = new WeakMap();
    const selector='#sendCodeBtn,#verifyCodeBtn,#resendCodeBtn,#setPasswordBtn,[data-theme-toggle]';
    document.addEventListener('pointerup', function(e){
      if (e.pointerType === 'mouse') return;
      const el=e.target&&e.target.closest?e.target.closest(selector):null;
      if(!el)return;
      recent.set(el,Date.now());
      e.preventDefault();
      el.click();
    }, {passive:false});
    document.addEventListener('click', function(e){
      if(!e.isTrusted)return;
      const el=e.target&&e.target.closest?e.target.closest(selector):null;
      if(!el)return; const t=recent.get(el)||0;
      if(Date.now()-t<700){recent.delete(el);e.preventDefault();e.stopPropagation();}
    }, true);
  })();
</script>
</body>
</html>
