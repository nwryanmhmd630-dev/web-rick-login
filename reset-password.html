<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بازیابی رمز عبور | وب‌ریک</title>
  <meta name="description" content="درخواست بازیابی رمز عبور حساب وب‌ریک">
  <meta name="theme-color" content="#070a17">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
</head>
<body data-page="reset" data-title="بازیابی رمز عبور">
<a class="skip-link" href="#main">پرش به فرم</a>
<div class="auth-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="وب‌ریک، صفحه معرفی">
      <span class="brand-mark" data-brand-mark aria-hidden="true"><svg class="" aria-hidden="true"><use href="#i-logo"/></svg></span>
      <span class="brand-text"><span class="brand-name" data-brand="name">Webric</span><span class="brand-sep" aria-hidden="true">|</span><span class="brand-fa" data-brand="nameFa">وب‌ریک</span></span>
    </a>
    <div class="topbar-actions">
      <a class="btn btn-quiet btn-sm btn-home" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>معرفی قالب</span></a>
      <button class="btn btn-ghost btn-icon theme-toggle" type="button" data-theme-toggle aria-pressed="true" aria-label="تغییر تم"><svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
  </header>
  <main id="main" class="auth-main">
    <div class="auth-wrap">
      <section class="auth-card glass glass-edge glass-sheen rise" aria-labelledby="page-title">
        <div class="demo-ribbon" data-demo-ribbon hidden><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span><strong>نسخه نمایشی.</strong> این فرم به سرور وصل نیست؛ چیزی ارسال یا ذخیره نمی‌شود.</span></div>
        <ol class="stepper" aria-label="مراحل بازیابی رمز">
          <li>شناسه</li><li>تأیید کد</li><li>رمز جدید</li><li>نتیجه</li>
        </ol>
        <header class="auth-head">
          <h1 id="page-title" data-text="resetTitle">بازیابی رمز عبور</h1>
          <p data-text="resetSubtitle"></p>
        </header>
        <form class="auth-form" id="reset-form" novalidate>
          <div class="field" data-field="identifier">
            <label class="label" for="identifier">ایمیل یا شماره موبایل</label>
            <div class="control has-ico">
              <svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>
              <input class="input ltr" id="identifier" name="identifier" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="name@example.com یا ۰۹۱۲۳۴۵۶۷۸۹" aria-describedby="identifier-err" required>
            </div>
            <p class="field-error" id="identifier-err"></p>
          </div>
          <div class="form-status" data-status role="status" aria-live="polite"></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" data-submit>
            <span class="btn-spinner" aria-hidden="true"></span><svg class="icon btn-state-icon ok" aria-hidden="true"><use href="#i-check"/></svg><svg class="icon btn-state-icon fail" aria-hidden="true"><use href="#i-x"/></svg>
            <span class="btn-label" data-text="resetButton">ارسال کد بازیابی</span>
          </button>
        </form>
        <div class="result" data-result hidden>
          <div class="result-icon"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg></div>
          <h2 tabindex="-1" data-result-title></h2>
          <p data-result-text></p>
          <a class="btn btn-ghost" href="set-password.html?demo=1" data-demo-next hidden>مشاهده مرحله تعیین رمز (دمو)<svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg></a>
        </div>
        <p class="auth-alt">رمز یادتان آمد؟<a class="link" href="login.html">بازگشت به ورود</a></p>
      </section>
    </div>
  </main>
  <footer class="auth-foot"><p data-text="footer">© وب‌ریک</p></footer>
</div>
<div class="toast-stack" data-toasts aria-live="polite"></div>
  <script src="js/icons.js" defer></script>
  <script src="js/validation.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth-ui.js" defer></script>
</body>
</html>
